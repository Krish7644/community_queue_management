databases:
  - name: community-scanner-db
    databaseName: community_scanner
    user: scanner
    plan: free

services:
  - type: web
    name: community-scanner
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn --chdir backend config.wsgi:application"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: community-scanner-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9

